server:
  port: 8081
spring:
  application:
    name: lilboard-identity
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USERNAME}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
auth:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: ${JWT_PUBLIC_KEY}
    private-key: ${JWT_PRIVATE_KEY}
    access-token-ttl: PT15M
