spring:
  application:
    name: lilboard-launcher

  datasource:
    url: jdbc:h2:mem:lilboard
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

server:
  port: 8080
