org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Coverage gate applied by the java.base convention (LINE COVEREDRATIO per module).
# Entry-point-only modules are excluded: their production code is the Spring Boot bootstrap.
coverage.minimum=0.80
coverage.excludes=*launcher*
