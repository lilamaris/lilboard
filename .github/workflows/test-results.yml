name: Test Results

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: test-results-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish test summary
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.repository.id == github.repository_id &&
      github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: write
      pull-requests: write

    steps:
      # Read PR metadata from GitHub, never from the untrusted test artifact.
      # This workflow deliberately does not check out or execute PR code.
      - name: Find current PR and test reports
        id: source
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha,
            });
            const pr = prs.find(pr =>
              pr.state === 'open' &&
              pr.base.repo.id === context.payload.repository.id &&
              pr.head.repo?.id === run.head_repository.id &&
              pr.head.sha === run.head_sha
            );
            if (!pr) {
              core.info('No open PR at this commit; skip stale or closed PR results.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id,
            });
            const reports = artifacts.find(a => a.name === 'test-reports' && !a.expired);
            if (!reports) {
              await core.summary.addRaw('No test reports were produced. See the CI run for lint, compile, or infrastructure failures.').write();
              return;
            }
            fs.writeFileSync('ci-event.json', JSON.stringify({
              repository: context.payload.repository,
              pull_request: pr,
              number: pr.number,
            }));
            core.setOutput('artifact_id', String(reports.id));
            core.setOutput('publish', 'true');

      - name: Download test reports from completed CI run
        if: steps.source.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: test-reports

      - name: Publish test summary
        if: steps.source.outputs.publish == 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-reports/**/TEST-*.xml
          commit: ${{ github.event.workflow_run.head_sha }}
          event_name: pull_request
          event_file: ci-event.json
          check_name: Test Results
          comment_title: 테스트 결과
          comment_mode: always
          compare_to_earlier_commit: 'false'
          action_fail_on_inconclusive: 'true'
